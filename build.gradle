plugins {
    id 'java'
    id 'application'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'calculator.App'
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
// I made the same in 'Configuration edit of Run/Debug' so it is not necessary
tasks.register('gui', JavaExec) {
    group = 'application'
    description = 'Runs the Swing GUI (same as the run task)'
    // In Gradle 8, assigning a Provider<String> to Property<String> is supported
    mainClass = application.mainClass
    classpath = sourceSets.main.runtimeClasspath
    args '--gui'
    standardInput = System.in
}
